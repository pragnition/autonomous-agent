# ci: this repo's own checks, on GitHub-hosted runners. `python` runs the Python test suite; `rust` runs the Rust
# workspace's tests (agentd and agent-holder), in the same toolchain image as the Dockerfile's `rust-dev` stage;
# `dashboard` builds and tests the dashboard frontend. They run on every PR, including the ones improve-jensen opens.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  rust:
    runs-on: ubuntu-latest
    container: rust:1.100-bookworm
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            rust/target
          key: rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-
      - run: cargo test --workspace --locked

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
