# improve-jensen: the agent that owns this repo. It runs on self-hosted runners on the stack's host and reaches
# Claude through the account proxy's `improve-jensen` origin, so it shares the team's account pool.
# Host setup: deploy/improve-jensen.md.
#
# The clock is the host listener (deploy/improve-jensen-listen.service), not GitHub's cron, which never fired these:
# it sends `improve-jensen-watch` at :17 and `improve-jensen-assess` at :10 every hour, and
# `improve-jensen-approvals` every 10 minutes (and at once after a decision in Slack), as repository_dispatch events.
# Each wakes its job only while `vars.IMPROVE_JENSEN_ENGINE` is `on`. The listener also answers replies to the
# proposals in Slack in plain language and stores the decisions it read for `approvals` to apply.
#
#   watch     - hourly (and on manual dispatch): deploys a pending change, measures what's outstanding, lets
#               Claude record what went wrong in the issues, then plans what the review jobs should pick up. It proposes
#               nothing: only the assessment posts proposals, a few at most and only with new evidence.
#   review    - one run per open Jensen PR the watch job's plan names (or the single PR a manual dispatch names).
#               The scheduled path never puts a PR URL in this workflow's own prompt or logs: it names a review by
#               index into this run's own `runs/<run id>-reviews.json`, and Claude looks the URL/conversation up
#               itself with `review-target`.
#   assess    - every hour when there's new conversation since the last one: lets Claude write an assessment
#               (what holds Jensen back, and what worked that Jensen should keep) and update the pinned assessment
#               issue, then posts the changes it proposes to Slack, learned ones marked as such.
#   approvals - every 10 minutes, no Claude: applies the decisions the listener stored and any plain reply or
#               reaction on the Slack proposals, labels each issue `approved` or `rejected`, and names the next
#               approved fix and project (none while core's usage watch holds the pool).
#   fix       - the one approved issue the approvals job named (or a manual dispatch's target), serialised so only
#               one fix runs at a time. Starts by checking the issue is still approved; ends by telling the
#               proposal's Slack thread whether it shipped.
#   project   - the one approved improvement project the approvals job named (or a manual dispatch's target),
#               serialised so only one project runs at a time. Starts and ends the same way.
#   respond   - answers issues labelled `improve-jensen` and comments that mention @improve-jensen, and opens PRs.
#               A person's own request, so it needs no approval in Slack. Its charter is .github/improve-jensen.md.
name: improve-jensen

on:
  repository_dispatch:
    types: [improve-jensen-watch, improve-jensen-assess, improve-jensen-approvals]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Which job to run
        options: [watch, review, fix, assess, project, approvals]
        default: watch
      target:
        type: string
        description: PR URL (review); issue number (fix, project); ignored for watch, assess and approvals
  issues:
    types: [opened, labeled, assigned]
  issue_comment:   # also a PR's ordinary comments; PR reviews aren't triggers, since they run the PR's own workflow
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: read

env:
  ANTHROPIC_BASE_URL: http://127.0.0.1:18092   # the proxy's improve-jensen origin
  IMPROVE_JENSEN_SLACK_CHANNEL: ${{ vars.IMPROVE_JENSEN_SLACK_CHANNEL || 'autonomous-agent' }}
  # A job ends when Claude's turn ends, so a subagent or command left in the background would die with nothing
  # written: Claude waits for each one instead.
  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
  JENSEN_GITHUB_LOGIN: ${{ vars.JENSEN_GITHUB_LOGIN }}   # Jensen's own GitHub account

jobs:
  watch:
    if: >
      (github.event_name == 'repository_dispatch' && github.event.action == 'improve-jensen-watch' &&
       vars.IMPROVE_JENSEN_ENGINE == 'on') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'watch')
    runs-on: [self-hosted, improve-jensen, watch]
    timeout-minutes: 60
    outputs:
      review_indices: ${{ steps.plan.outputs.review_indices }}
      has_reviews: ${{ steps.plan.outputs.has_reviews }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: deploy a pending change, if one is waiting
        continue-on-error: true
        run: python scripts/deploy.py --if-pending --wait-idle-s 0
      - name: measure
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py measure --github-output "$GITHUB_OUTPUT"
      - name: claude
        id: claude
        if: steps.measure.outputs.has_work == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: sk-ant-oat01-container-via-host-proxy   # placeholder; the proxy swaps in a real account
          prompt: |
            Run the hourly watch. Digest: ${{ steps.measure.outputs.digest }}. Use the state folder
            ($IMPROVE_JENSEN_STATE, default ~/.local/state/improve-jensen). Follow .github/improve-jensen-watch.md.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --append-system-prompt-file .github/improve-jensen-watch.md
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Task,WebFetch,WebSearch,TodoWrite"
      - name: plan
        id: plan
        if: steps.measure.outputs.has_work == 'true' && steps.claude.outcome == 'success'
        run: python scripts/jensen_watch.py plan --github-output "$GITHUB_OUTPUT"
      - name: commit
        if: steps.measure.outputs.skip_reason != 'pool_hold' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'skipped')
        run: python scripts/jensen_watch.py commit

  assess:
    if: >
      (github.event_name == 'repository_dispatch' && github.event.action == 'improve-jensen-assess' &&
       vars.IMPROVE_JENSEN_ENGINE == 'on') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'assess')
    runs-on: [self-hosted, improve-jensen, watch]   # never queued behind a fix or project being shipped
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: assess-check
        id: assess-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py assess-check --github-output "$GITHUB_OUTPUT"
      - name: claude
        id: claude
        if: steps.assess-check.outputs.has_work == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: sk-ant-oat01-container-via-host-proxy   # placeholder; the proxy swaps in a real account
          prompt: |
            Run the assessment. Use the state folder ($IMPROVE_JENSEN_STATE, default
            ~/.local/state/improve-jensen). Write assessment.md, update the pinned assessment issue, and write
            assess-plan.json. Follow .github/improve-jensen-assess.md.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --append-system-prompt-file .github/improve-jensen-assess.md
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Task,WebFetch,WebSearch,TodoWrite"
      # The one place proposals go out: one Slack message, few and fresh (approvals.post_proposals).
      - name: propose
        if: steps.claude.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py propose --from assess
      # The next assessment reads everything since this one started, so nothing written while it ran is missed.
      - name: assess-commit
        if: steps.claude.outcome == 'success'
        env:
          STARTED: ${{ steps.assess-check.outputs.started }}
        run: python scripts/jensen_watch.py assess-commit --at "$STARTED"

  approvals:
    # No Claude here: it reads the Slack threads, labels the issues and names what `fix` and `project` run next.
    if: >
      (github.event_name == 'repository_dispatch' && github.event.action == 'improve-jensen-approvals' &&
       vars.IMPROVE_JENSEN_ENGINE == 'on') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'approvals')
    runs-on: [self-hosted, improve-jensen, work]
    timeout-minutes: 15
    concurrency:
      group: improve-jensen-approvals
      cancel-in-progress: false
    outputs:
      fix: ${{ steps.approvals.outputs.fix }}
      has_fix: ${{ steps.approvals.outputs.has_fix }}
      project: ${{ steps.approvals.outputs.project }}
      has_project: ${{ steps.approvals.outputs.has_project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: approvals
        id: approvals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py approvals --github-output "$GITHUB_OUTPUT"

  project:
    needs: approvals
    if: >
      !cancelled() &&
      (needs.approvals.outputs.has_project == 'true' || (inputs.mode == 'project' && inputs.target != ''))
    runs-on: [self-hosted, improve-jensen, work]
    timeout-minutes: 360
    concurrency:
      group: improve-jensen-project
      cancel-in-progress: false
    env:
      # Resolved once, here, so every step below reads the same value through `$TARGET`/`env.TARGET` -- never by
      # re-interpolating `${{ inputs.target }}` directly into a `run:` script, which would hand a workflow-
      # dispatch user's raw input straight to the shell.
      TARGET: ${{ inputs.mode == 'project' && inputs.target || needs.approvals.outputs.project }}
      # A person's own dispatch with a target always goes; the approvals job's pick is checked first (`ready`).
      MANUAL: ${{ inputs.mode == 'project' && inputs.target != '' }}
    steps:
      # No job token left in the git config, for the same reason as in `fix`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      # As in `fix`: go only while the project is still open and approved, with nobody needed.
      - name: ready
        id: ready
        if: env.MANUAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py ready --issue "$TARGET" --kind project --github-output "$GITHUB_OUTPUT"
      - name: claude
        id: claude
        if: steps.ready.outputs.go == 'true' || env.MANUAL == 'true'
        timeout-minutes: 350
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: sk-ant-oat01-container-via-host-proxy   # placeholder; the proxy swaps in a real account
          prompt: |
            Work on improvement project #${{ env.TARGET }}; if its branch and progress file exist, continue from
            them. Follow .github/improve-jensen-project.md.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 500
            --append-system-prompt-file .github/improve-jensen-project.md
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Task,WebFetch,WebSearch,TodoWrite"
      # A finished project is closed by now; one that needs a person says so in its Slack thread, once. An
      # unfinished one says nothing: the next approvals run starts its next run. Two runs in a row that didn't
      # succeed mark it `stuck`, so a failing project doesn't run again and again.
      - name: tell the Slack thread
        if: always() && (steps.ready.outputs.go == 'true' || env.MANUAL == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py fired --issue "$TARGET" --kind project --outcome "${{ steps.claude.outcome }}"

  review:
    needs: watch
    if: >
      !cancelled() &&
      ((inputs.mode == 'review' && inputs.target != '') || needs.watch.outputs.has_reviews == 'true')
    runs-on: [self-hosted, improve-jensen, work]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        index: ${{ fromJSON(inputs.mode == 'review' && '[0]' || needs.watch.outputs.review_indices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: sk-ant-oat01-container-via-host-proxy   # placeholder; the proxy swaps in a real account
          prompt: >-
            ${{ inputs.mode == 'review' && format('Review the PR at {0}.', inputs.target) || format('Review the
            PR at index {0} of run {1}; get its URL and conversation with `python scripts/jensen_watch.py
            review-target --run {1} --index {0}`.', matrix.index, github.run_id) }} Never write product or repo
            names in your final message. Follow .github/improve-jensen-review.md.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --append-system-prompt-file .github/improve-jensen-review.md
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Task,WebFetch,WebSearch,TodoWrite"

  fix:
    needs: approvals
    if: >
      !cancelled() &&
      ((inputs.mode == 'fix' && inputs.target != '') || needs.approvals.outputs.has_fix == 'true')
    runs-on: [self-hosted, improve-jensen, work]
    timeout-minutes: 120
    concurrency:
      group: improve-jensen-fix
      cancel-in-progress: false
    env:
      # Resolved once, here, so every step below reads the same value through `$TARGET`/`env.TARGET` -- never by
      # re-interpolating `${{ inputs.target }}` directly into a `run:` script, which would hand a workflow-
      # dispatch user's raw input straight to the shell.
      TARGET: ${{ inputs.mode == 'fix' && inputs.target || needs.approvals.outputs.fix }}
      # A person's own dispatch with a target always goes; the approvals job's pick is checked first (`ready`).
      MANUAL: ${{ inputs.mode == 'fix' && inputs.target != '' }}
    steps:
      # No job token left in the git config: Claude's pushes must go out as the Claude app, since a push made with
      # this job's GITHUB_TOKEN never triggers `ci` and `gh pr checks --watch` would wait for checks that never come.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      # The approvals run that named the issue can be minutes old: go only while it's still open and approved,
      # with no `stuck` or `needs-person`.
      - name: ready
        id: ready
        if: env.MANUAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py ready --issue "$TARGET" --kind fix --github-output "$GITHUB_OUTPUT"
      - name: add the fixing label
        if: steps.ready.outputs.go == 'true' || env.MANUAL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create fixing --force -R ${{ github.repository }}
          gh issue edit "$TARGET" --add-label fixing -R ${{ github.repository }}
      - name: claude
        id: claude
        if: steps.ready.outputs.go == 'true' || env.MANUAL == 'true'
        timeout-minutes: 110   # leaves the always() steps below room inside the job's 120-minute budget
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: sk-ant-oat01-container-via-host-proxy   # placeholder; the proxy swaps in a real account
          prompt: |
            Fix issue #${{ env.TARGET }}. Follow .github/improve-jensen.md.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 300
            --append-system-prompt-file .github/improve-jensen.md
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Task,WebFetch,WebSearch,TodoWrite"
      - name: remove the fixing label
        if: always() && (steps.ready.outputs.go == 'true' || env.MANUAL == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$TARGET" --remove-label fixing -R ${{ github.repository }}
      # A merged fix closed its issue: the thread hears it shipped. One still open didn't ship, and is marked
      # `stuck` for a person.
      - name: tell the Slack thread
        if: always() && (steps.ready.outputs.go == 'true' || env.MANUAL == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jensen_watch.py fired --issue "$TARGET" --kind fix --outcome "${{ steps.claude.outcome }}"

  respond:
    # A person's own request. One Jensen files itself (`vars.JENSEN_GITHUB_LOGIN`) is proposed in Slack instead,
    # by the hourly watch, and ships only once a person approves it.
    if: >
      github.actor != vars.JENSEN_GITHUB_LOGIN && (
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'improve-jensen') &&
       (github.event.action != 'labeled' || github.event.label.name == 'improve-jensen')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@improve-jensen')))
    runs-on: ${{ fromJSON(vars.IMPROVE_JENSEN_ENGINE == 'on' && '["self-hosted", "improve-jensen", "work"]' ||
      '["self-hosted", "improve-jensen"]') }}
    timeout-minutes: 120
    concurrency:
      group: improve-jensen-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4   # persist-credentials: false for the same reason as in `fix`
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: sk-ant-oat01-container-via-host-proxy   # placeholder; the proxy swaps in a real account
          trigger_phrase: "@improve-jensen"
          label_trigger: "improve-jensen"
          branch_prefix: "improve-jensen/"
          track_progress: true
          prompt: >-
            ${{ vars.IMPROVE_JENSEN_ENGINE != 'on' && 'The engine is not switched on: open the PR and stop there.
            Don''t merge or deploy; a person merges.' || '' }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --append-system-prompt-file .github/improve-jensen.md
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Task,WebFetch,WebSearch,TodoWrite"
