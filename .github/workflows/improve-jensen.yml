# improve-jensen: the agent that owns this repo. It answers issues labelled `improve-jensen`
# and comments that mention @improve-jensen, and opens PRs. Its charter is .github/improve-jensen.md.
# It runs on a self-hosted runner on the stack's host and reaches Claude through the account proxy's
# `improve-jensen` origin, so it shares the team's account pool. Host setup: deploy/improve-jensen.md.
name: improve-jensen

on:
  issues:
    types: [opened, labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: improve-jensen-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  improve-jensen:
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'improve-jensen')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@improve-jensen')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@improve-jensen')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@improve-jensen'))
    runs-on: [self-hosted, improve-jensen]
    env:
      ANTHROPIC_BASE_URL: http://127.0.0.1:18092   # the proxy's improve-jensen origin
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: sk-ant-oat01-container-via-host-proxy   # placeholder; the proxy swaps in a real account
          trigger_phrase: "@improve-jensen"
          label_trigger: "improve-jensen"
          branch_prefix: "improve-jensen/"
          track_progress: true
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --append-system-prompt-file .github/improve-jensen.md
            --allowedTools "Bash(pytest:*),Bash(python:*),Bash(pip:*),Bash(git:*),Bash(gh:*),Edit,Write,Read,Glob,Grep"
