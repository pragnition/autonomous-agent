# Create the Slack app from this manifest (api.slack.com/apps → Create New App → From an app manifest).
# Rename "chilli" to the agent's name. The read scopes are requested now so ambient mode never needs a reinstall.
display_information:
  name: chilli
  description: The team's autonomous engineering agent (an AI).
features:
  bot_user:
    display_name: chilli
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - reactions:write
      - files:write
      - users:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
