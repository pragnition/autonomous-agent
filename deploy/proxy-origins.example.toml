# Add these to ~/.claude/accounts/proxy.toml (the proxy's own config). Both origins belong to the default tenant,
# so the agent shares the team's account pool. core reads usage through the relay (agent-core); sandboxes reach
# agent-sandbox as host.docker.internal:18091, allowed by their network policy (spec v2 §4).
container_placeholders = ["sk-ant-oat01-container-via-host-proxy"]

[origins]
agent-core = 18090
agent-sandbox = 18091
