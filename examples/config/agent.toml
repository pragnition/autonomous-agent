# Example install config. Copy to /data/config/agent.toml and edit.
name = "chilli"                  # the agent's display name and branch prefix
# github = "chilli-bot"          # the agent's GitHub login, when it differs from name
timezone = "Asia/Singapore"

[slack]
channels = ["#chilli"]           # where it answers mentions (DMs always work for listed people)

[people.parthib]
slack = "U00000001"
github = "parthib-example"
linear = "parthib@example.com"
role = "admin"
tailscale = "parthib@example.com"   # Tailscale login: an admin with one can resume the agent from the dashboard

[people.alice]
slack = "U00000002"
github = "alice-example"
linear = "alice@example.com"
role = "member"

[limits]
max_concurrent_sessions = 3      # Claude sessions running at once, across all sandboxes
max_tasks_per_day = 20
task_minutes = 90                # wall-time budget per work item
max_turns = 400

[claude.models]
default = "claude-opus-5-5"      # all real work
hard = "claude-fable-5-1"        # when someone says "use fable" in a conversation
chores = "claude-sonnet-5"       # memory consolidation

[sandbox]
isolation = "open"               # "open": one agent container (spec v3); "sandboxes": Docker Sandboxes via sandboxd (spec v2)
agent_uid = 1001                 # the agent container's user; core hands it the Azure login and runner tokens
# The rest of this table applies to isolation = "sandboxes".
host_memory_budget = 0.75        # never let running sandboxes use more than this share of host RAM
idle_stop_minutes = 30
rebuild_every_days = 7

[sandbox.resources.code]         # code-<project>: builds, tests, the app in Docker, a browser
cpus = 4
memory_gb = 8
disk_gb = 30

[sandbox.resources.debug]        # debug-<project>: production logs, locked down
cpus = 2
memory_gb = 2
disk_gb = 10

[sandbox.resources.general]      # DMs and memory chores
cpus = 2
memory_gb = 2
disk_gb = 10

[linear]
public_url = ""                  # e.g. "https://jensen.<tailnet>.ts.net": Linear's webhook and OAuth callback, via Tailscale Funnel

# MCP servers every session gets. ${VAR} comes from the session's environment (agent.env, and LINEAR_APP_TOKEN once
# the Linear app is installed), so the agent searches and edits Linear as itself.
[mcp.linear]
type = "http"
url = "https://mcp.linear.app/mcp"
headers = { Authorization = "Bearer ${LINEAR_APP_TOKEN}" }

# The dashboard: core serves it on `port`, published on the host as 127.0.0.1:18086; `just dashboard-serve` puts it
# on the tailnet only. It answers requests only from trusted_peers (where tailscale serve's requests arrive).
[dashboard]
port = 8086
trusted_peers = ["172.30.0.1"]
agent_origins = ["agent-core", "agent-sandbox"]   # the account proxy's origins that are the agent; others are people

# Model calls from the apps the agent runs and tests (a project's own LLM features). Apps point their OpenAI-style
# base URL at http://172.30.0.10:8087/llm/<upstream> (core's fixed address) with any placeholder key; core adds the real key (core.env), counts
# each call's tokens at these prices, and refuses calls once the day's or month's cap is spent. The dashboard can
# change the caps at runtime. Without upstreams, the meter doesn't run.
[llm_meter]
daily_usd = 10
monthly_usd = 100
# [llm_meter.upstreams.<project>-dev]
# base_url = "https://<resource>.openai.azure.com/openai/v1"
# key = "<PROJECT>_DEV_FOUNDRY_KEY"        # in core.env

[llm_meter.prices]                         # USD per million tokens: [input, cached input, output]
"gpt-5.6-terra" = [2.0, 0.2, 12.0]         # Azure Global Standard, short context
default = [5.0, 0.5, 30.0]                 # anything not listed: priced high on purpose

[observability]
digest_channel = ""              # e.g. "#agent-ops": a daily KPI digest; empty means none
digest_time = "09:00"            # in `timezone`

# Azure CLI, run by core with an admin's own login (az_login). Only debug sessions get the az tool.
# Everything not listed in confirm/deny runs on its own; unattended runs may only run `read` commands.
[cli.azure]
command = "az"
profiles = ["debug"]
env = { AZURE_CONFIG_DIR = "/data/cli/azure", AZURE_CORE_OUTPUT = "json", AZURE_CORE_ONLY_SHOW_ERRORS = "true", AZURE_CORE_COLLECT_TELEMETRY = "false" }
login = ["az", "login", "--use-device-code"]
login_check = ["az", "account", "show"]
relogin_patterns = ["az login", "AADSTS"]
read = ["* list", "* show", "* query", "* tail", "webapp log *", "monitor *", "account show"]
confirm = ["* delete", "* purge", "* create", "group *", "deployment *", "network *", "* scale", "* swap", "role *", "ad *", "policy *", "lock *", "account set"]
deny = ["keyvault secret *", "* keys list", "* list-keys", "* connection-string *", "webapp config appsettings list", "* credential* list", "* show-credentials"]
egress = ["login.microsoftonline.com", "management.azure.com", "api.loganalytics.io", "api.applicationinsights.io"]
