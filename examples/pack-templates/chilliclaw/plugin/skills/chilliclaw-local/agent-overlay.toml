# Appended to deployments/default/config.local-lite.toml for the agent's local runs (the chilliclaw-local skill).
# Every chat model call goes to the dev Foundry deployment through the agent's meter at core's fixed address (the
# app's containers can't resolve the name `core`): core adds the key and stops
# calls once the cost cap is spent. AGENT_LLM_KEY is a placeholder in .env; the meter replaces it.
# Integrations that need a real tenant's credentials (Slack, Teams, Outlook, Microsoft sharing) and the features
# that need their own Foundry deployments (audio transcription, image generation) are off, so the stack runs with
# no secrets.

[projects]
sharing_enabled = false

[integrations.slack]
enabled = false

[integrations.microsoft.teams]
enabled = false

# NCSgpt calls a production service and needs a Microsoft tenant: never from the agent's runs
[extensions.ncsgpt]
enabled = false

# These specialists work through Outlook, which has no tenant here, and NCSgpt's Excel runner
[agent.specialists.email]
enabled = false

[agent.specialists.smart_meeting_minutes]
enabled = false

[agent.specialists.excel_analyser]
enabled = false

[integrations.microsoft.outlook.triggers]
enabled = false

[integrations.microsoft.outlook.calendar_triggers]
enabled = false

# Off (audio stays nominally on: video upload validation depends on it), but the schema still wants a URL and a
# model; nothing listens on port 9
[workspace.transcribe_audio]
enabled = false
base_url = "http://127.0.0.1:9"
model = "off-in-local-runs"

[workspace.generate_image]
enabled = false
base_url = "http://127.0.0.1:9"
model = "off-in-local-runs"

[project_files.audio]
base_url = "http://127.0.0.1:9"
api_key = "off-in-local-runs"
model = "off-in-local-runs"

[llm.deployments.main]
backend = "foundry"
model = "chilliclaw-dev-gpt-5.6-terra"

[llm.deployments.main.foundry]
base_url = "http://172.30.0.10:8087/llm/chilliclaw-dev"
auth_mode = "api_key"
api_key_env = "AGENT_LLM_KEY"
key_vault_secret_name = "unused-the-agent-meter-adds-the-key"
regional_endpoints_env = "AGENT_LLM_NO_REGIONS"

[llm.deployments.email_summary]
backend = "foundry"
model = "chilliclaw-dev-gpt-5.6-terra"

[llm.deployments.email_summary.foundry]
base_url = "http://172.30.0.10:8087/llm/chilliclaw-dev"
auth_mode = "api_key"
api_key_env = "AGENT_LLM_KEY"
key_vault_secret_name = "unused-the-agent-meter-adds-the-key"
regional_endpoints_env = "AGENT_LLM_NO_REGIONS"

[llm.deployments.usecase_classifier]
backend = "foundry"
model = "chilliclaw-dev-gpt-5.6-terra"

[llm.deployments.usecase_classifier.foundry]
base_url = "http://172.30.0.10:8087/llm/chilliclaw-dev"
auth_mode = "api_key"
api_key_env = "AGENT_LLM_KEY"
key_vault_secret_name = "unused-the-agent-meter-adds-the-key"
regional_endpoints_env = "AGENT_LLM_NO_REGIONS"
