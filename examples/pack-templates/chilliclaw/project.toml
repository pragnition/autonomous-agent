# The ChilliClaw pack. Copy it to /data/config/packs/chilliclaw/ (the data directory's config/packs/chilliclaw).
# Its local runs call the dev Foundry through the agent's meter, so agent.toml needs the upstream, and core.env the key:
#   [llm_meter.upstreams.chilliclaw-dev]
#   base_url = "https://chilliclaw-dev-models-eastus2.openai.azure.com/openai/v1"
#   key = "CHILLICLAW_DEV_FOUNDRY_KEY"
[project]
name = "chilliclaw"
repo = "pragnition/chilliclaw"
default_branch = "main"
owner = "parthib"                    # owns PRs from unmapped requesters
slack_channel = "#chilliclaw-dev"    # CONFIRM: where task threads for work that starts outside Slack go
linear_team = "PRA"
network = "open"

[linear.status]                      # the PRA team's workflow states
working = "In Progress"
ready_for_review = "In Review/Testing"
merged = "Done"
failed = "Todo"

[build]
# `setup` runs once when a session's worktree is created. The .env holds no real secrets: placeholders are filled
# with local-only values, and model calls go through the agent's meter, which adds the Foundry key (the
# chilliclaw-local skill). `checks` run before every PR.
setup = [
  '''test -f .env || { cp .env.example .env && sed -i -E "s/^(CREDENTIAL_ENCRYPTION_KEY)=.*/\1=$(python3 -c 'import secrets; print(secrets.token_hex(32))')/; s/^([A-Z0-9_]+)=REPLACE_ME.*/\1=local-placeholder/" .env && echo AGENT_LLM_KEY=metered >> .env; }''',
  "bun install --frozen-lockfile",
]
checks = ["just check"]

[secrets]
worker = []                          # test-only values handed to coding sessions; none needed
