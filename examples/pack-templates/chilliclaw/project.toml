# The ChilliClaw pack. Copy it to /data/config/packs/chilliclaw/ (the data directory's config/packs/chilliclaw).
# Its local runs call the dev Foundry through the agent's meter, so agent.toml needs the upstream, and core.env the key:
#   [llm_meter.upstreams.chilliclaw-dev]
#   base_url = "https://<dev-foundry-resource>.openai.azure.com/openai/v1"
#   key = "CHILLICLAW_DEV_FOUNDRY_KEY"
[project]
name = "chilliclaw"
repo = "pragnition/chilliclaw"
default_branch = "main"
owner = "sam"                        # owns PRs from unmapped requesters
slack_channel = "#chilliclaw-dev"    # where task threads for work that starts outside Slack go
linear_team = "PRA"

[linear.status]                      # the PRA team's workflow states
working = "In Progress"
ready_for_review = "In Review/Testing"
merged = "Done"
failed = "Todo"

[build]
# `setup` runs once when a session's worktree is created. It writes the worktree's .env from the team's own
# ChilliClaw .env (data/secrets/projects/chilliclaw.env, which core hands to the agent) on top of .env.example, so
# keys newer than the team's file still exist. Placeholders get local-only values, and blank internal tokens are
# left out so ChilliClaw's env generator makes them (a blank one would win, because its justfile loads .env). Model
# calls go through the agent's meter, which adds the Foundry key (the chilliclaw-local skill). `checks` run before
# every PR.
setup = [
  '''test -f .env || python3 - <<'PY'
import os, secrets
TEAM_ENV = "/run/agent/projects/chilliclaw.env"
GENERATED = {"DOCUMENT_RENDERER_TOKEN", "OFFICE_EDIT_WORKER_TOKEN", "PII_SANITISATION_TOKEN", "DSL_EXECUTOR_TOKEN",
             "MILVUS_MINIO_ACCESS_KEY", "MILVUS_MINIO_SECRET_KEY", "KNOWLEDGE_INDEX_REPORTS_AZURITE_KEY"}
def pairs(path):
    for line in open(path).read().splitlines():
        key, sep, value = line.partition("=")
        if sep and key and not key.startswith("#"):
            yield key.strip(), value
team = dict(pairs(TEAM_ENV)) if os.path.exists(TEAM_ENV) else {}
merged = {key: team.get(key, value) for key, value in pairs(".env.example")}  # newer keys exist, team values win
merged.update(team)
out = []
for key, value in merged.items():
    if key in GENERATED and not value:
        continue
    if value.startswith("REPLACE_ME"):
        value = secrets.token_hex(32) if key == "CREDENTIAL_ENCRYPTION_KEY" else "local-placeholder"
    out.append(f"{key}={value}")
open(".env", "w").write("\n".join(out + ["AGENT_LLM_KEY=metered"]) + "\n")
PY''',
  "bun install --frozen-lockfile",
]
checks = ["just check"]

[secrets]
worker = []                          # names of test-only keys in core.env, for sessions on this project; none needed
