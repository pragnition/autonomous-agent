# The ChilliClaw pack. Copy it to /data/config/packs/chilliclaw/ (the data directory's config/packs/chilliclaw).
# Its local runs call the dev Foundry through the agent's meter, so agent.toml needs the upstream, and core.env the key:
#   [llm_meter.upstreams.chilliclaw-dev]
#   base_url = "https://chilliclaw-dev-models-eastus2.openai.azure.com/openai/v1"
#   key = "CHILLICLAW_DEV_FOUNDRY_KEY"
[project]
name = "chilliclaw"
repo = "pragnition/chilliclaw"
default_branch = "main"
owner = "parthib"                    # owns PRs from unmapped requesters
slack_channel = "#chilliclaw-dev"    # CONFIRM: where task threads for work that starts outside Slack go
linear_team = "PRA"
network = "open"

[linear.status]                      # the PRA team's workflow states
working = "In Progress"
ready_for_review = "In Review/Testing"
merged = "Done"
failed = "Todo"

[build]
# `setup` runs once when a session's worktree is created. It writes a .env from .env.example with no real secrets:
# placeholders get local-only values, and the internal tokens ChilliClaw's env generator makes are left out (a blank
# one would win over the generated one, because its justfile loads .env). Model calls go through the agent's meter,
# which adds the Foundry key (the chilliclaw-local skill). `checks` run before every PR.
setup = [
  '''test -f .env || python3 - <<'PY'
import secrets
GENERATED = {"DOCUMENT_RENDERER_TOKEN", "OFFICE_EDIT_WORKER_TOKEN", "PII_SANITISATION_TOKEN", "DSL_EXECUTOR_TOKEN",
             "MILVUS_MINIO_ACCESS_KEY", "MILVUS_MINIO_SECRET_KEY", "KNOWLEDGE_INDEX_REPORTS_AZURITE_KEY"}
out = []
for line in open(".env.example").read().splitlines():
    key, sep, value = line.partition("=")
    if sep and not key.startswith("#"):
        if key in GENERATED and not value:
            continue
        if key == "CREDENTIAL_ENCRYPTION_KEY":
            value = secrets.token_hex(32)
        elif value.startswith("REPLACE_ME"):
            value = "local-placeholder"
        line = f"{key}={value}"
    out.append(line)
open(".env", "w").write("\n".join(out + ["AGENT_LLM_KEY=metered"]) + "\n")
PY''',
  "bun install --frozen-lockfile",
]
checks = ["just check"]

[secrets]
worker = []                          # test-only values handed to coding sessions; none needed
