# The autonomous agent's stack. Host data lives under ${AGENT_DATA:-./data}:
#   config/ (agent.toml, packs/, persona.toml)   db/   runs/   cli/   schedules/   tasks/ (the task record)
#   runner/ (what the conversations' containers read: the Linear token, the projects' env files, the timezone)
#   secrets/core.env (the control plane's own), secrets/agent.env (the sessions' keys), secrets/supervisor.env
#   secrets/projects/<project>.env   (a project's app .env; agentd hands it to the sessions as runner/projects/)
# The control plane (agentd, in `control`) runs each conversation in a Docker container of its own, from the agent
# image, sharing the `docker` service's network. The Claude account proxy runs on the host; the relay lets the
# control plane read its usage and the sessions reach it. deploy/env.sh writes DOCKER_GID and AGENTD_DATA_HOST to
# .env (`just up` runs it).
name: autonomous-agent

networks:
  agentnet:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

services:
  # The control plane: Slack and Linear, the work queue, the tools, schedules, the dashboard (:8086), the meter
  # (:8087) and the Linear listener (:8085), and a container per conversation through the host's Docker socket. It
  # runs as the agent user with the socket's group. Turns run in the conversations' containers, so restarting it
  # interrupts none of them.
  control:
    build: {context: ., target: agent}
    image: autonomous-agent-agent   # also the image of every conversation's container ([containers] image)
    container_name: agent-control
    restart: unless-stopped
    init: true                  # reaps what agentd starts (az reads)
    user: "1001"
    group_add: ["${DOCKER_GID:?run deploy/env.sh first}"]
    command: [agentd, serve]
    depends_on: [docker]
    networks:
      agentnet:
        ipv4_address: 172.30.0.10   # fixed: apps in the agent's own Docker reach the meter by address
    ports:
      - "127.0.0.1:18085:8085"    # Linear's webhook and OAuth callback only; Tailscale Funnel exposes this port
      - "127.0.0.1:18086:8086"    # the dashboard; `just dashboard-serve` puts it on the tailnet only, never Funnel
    environment:
      AGENTD_DATA_HOST: ${AGENTD_DATA_HOST:?run deploy/env.sh first}  # for the conversations' mounts
      AGENT_NAME: ${AGENT_NAME:-agent}
      AGENT_GIT_EMAIL: ${AGENT_GIT_EMAIL:-}
      SOFT_CAP_5H: ${SOFT_CAP_5H:-1.0}             # an account counts as full at this share of its 5-hour window...
      SOFT_CAP_LIFT_S: ${SOFT_CAP_LIFT_S:-5400}    # ...until this many seconds before the window resets
      # Sessions and their subagents compact near this many tokens of context instead of near the model's 1M window
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: ${CLAUDE_CODE_AUTO_COMPACT_WINDOW:-200000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentwork:/var/agent
      - ${AGENT_DATA:-./data}/config:/data/config
      - ${AGENT_DATA:-./data}/db:/data/db
      - ${AGENT_DATA:-./data}/runs:/data/runs
      - ${AGENT_DATA:-./data}/cli:/data/cli
      - ${AGENT_DATA:-./data}/runner:/data/runner
      - ${AGENT_DATA:-./data}/schedules:/data/schedules
      - ${AGENT_DATA:-./data}/tasks:/data/tasks
      - ${AGENT_DATA:-./data}/secrets/core.env:/run/agent/secrets.env:ro
      - ${AGENT_DATA:-./data}/secrets/agent.env:/data/secrets/agent.env:ro   # read for each session, never by agentd
      - ${AGENT_DATA:-./data}/secrets/projects:/data/secrets/projects:ro

  # The agent's own long-running services (a bridge, a poller: /var/agent/services.toml) and its home folder and
  # browsers on the volume.
  services:
    build: {context: ., target: agent}
    image: autonomous-agent-agent
    container_name: agent-services
    restart: unless-stopped
    init: true
    stop_grace_period: 30s      # time to stop the agent's services (10 s each at most)
    network_mode: service:docker
    depends_on: [docker]
    command: [python, -m, agent, services, --root, /var/agent, --agent-name, "${AGENT_NAME:-agent}",
              --git-email, "${AGENT_GIT_EMAIL:-}"]
    env_file: ["${AGENT_DATA:-./data}/secrets/agent.env"]
    volumes:
      - ${AGENT_DATA:-./data}/runner:/run/agent:ro
      - ${AGENT_DATA:-./data}/cli/azure:/data/cli/azure
      - ${AGENT_DATA:-./data}/schedules:/data/schedules
      - ${AGENT_DATA:-./data}/tasks:/data/tasks:ro
      - agentwork:/var/agent

  # The agent's own Docker daemon: the apps it runs to test its work start here, never on the laptop's Docker.
  # Its API listens only on 127.0.0.1 of this container's network, which the agent container shares (below), so an
  # app published on 127.0.0.1:<port> is the agent's localhost too. The work volume is mounted at the same path as
  # in the agent container, so a compose file's bind mounts of a worktree resolve.
  docker:
    image: docker:29-dind
    container_name: agent-docker
    restart: unless-stopped
    privileged: true
    # Everything the agent runs in here (its apps, their databases, builds) shares these caps, so a heavy stack is
    # killed in here instead of pushing the laptop into swap. No swap: memory-hungry apps fail fast, not slowly.
    mem_limit: 12g
    memswap_limit: 12g
    cpus: 5
    pids_limit: 8192
    networks: [agentnet]
    environment:
      DOCKER_TLS_CERTDIR: ""
    # Starting with `dockerd` keeps the image from adding its own 0.0.0.0:2375 listener on the stack network
    command: [dockerd, --host=unix:///var/run/docker.sock, --host=tcp://127.0.0.1:2375, --tls=false,
              "--default-address-pool=base=10.201.0.0/16,size=24"]
    volumes:
      - agentdocker:/var/lib/docker
      - agentwork:/var/agent

  # Two supervisors that watch the control plane and each other. Each restarts the other when it is down or its loop
  # has stalled; only the primary acts on the control plane, and the standby takes it over only while the primary is
  # down. Down again within 30 minutes of a restart: an alert, no restart.
  supervisor:
    build: {context: ., target: supervisor}
    container_name: agent-supervisor
    restart: unless-stopped
    networks: [agentnet]
    environment:
      SUPERVISOR_ROLE: primary
      CONTROL_HEALTH: http://control:8080/health
      CONTROL_CONTAINER: agent-control
      PEER_HEALTH: http://supervisor-standby:8090/health
      PEER_CONTAINER: agent-supervisor-standby
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AGENT_DATA:-./data}/secrets/supervisor.env:/run/agent/secrets.env:ro

  supervisor-standby:
    build: {context: ., target: supervisor}
    container_name: agent-supervisor-standby
    restart: unless-stopped
    networks: [agentnet]
    environment:
      SUPERVISOR_ROLE: standby
      CONTROL_HEALTH: http://control:8080/health
      CONTROL_CONTAINER: agent-control
      PEER_HEALTH: http://supervisor:8090/health
      PEER_CONTAINER: agent-supervisor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AGENT_DATA:-./data}/secrets/supervisor.env:/run/agent/secrets.env:ro

  relay:
    build: {context: ., target: relay}
    container_name: agent-relay
    restart: unless-stopped
    network_mode: host
    # Listens only on the stack's own gateway address, never on the LAN: nobody else can reach the accounts.
    command:
      - sh
      - -c
      - >-
        socat TCP-LISTEN:28090,bind=172.30.0.1,fork,reuseaddr TCP:127.0.0.1:18090 &
        socat TCP-LISTEN:28091,bind=172.30.0.1,fork,reuseaddr TCP:127.0.0.1:18091 &
        wait

volumes:
  agentwork:     # the agent's clones, sessions, memory and caches; survives rebuilds so sessions can resume
  agentdocker:   # the agent's Docker images, containers and volumes (the apps it tests)
